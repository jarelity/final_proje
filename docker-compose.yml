services:
  db:
    image: postgres:16-alpine
    container_name: kisisel_blog_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: personal_blog
      POSTGRES_USER: blog_user
      POSTGRES_PASSWORD: blog_password
    ports:
      - "5432:5432"
    volumes:
      - blog_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blog_user -d personal_blog"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  blog_postgres_data:
